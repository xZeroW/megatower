[package]
name = "megatower-game"
version.workspace = true
edition.workspace = true

[[bin]]
name = "megatower"
path = "src/main.rs"

[dependencies]
bevy.workspace = true
bevy_brp_extras = { workspace = true, optional = true }
bevy_auto_plugin.workspace = true
megatower-core = { path = "../../crates/megatower-core" }
megatower-runtime = { path = "../../crates/megatower-runtime" }
megatower-ui = { path = "../../crates/megatower-ui" }

[features]
# Remote control for QA: BRP on port 15702 with bevy_brp_extras
# (screenshots, key/mouse injection). `cargo run --features dev`.
dev = ["dep:bevy_brp_extras", "bevy/bevy_remote", "bevy/png"]
