[package]
name = "tower_loot"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.20", features = ["wav", "bevy_settings"] }
bevy_auto_plugin = "0.12"
bevy_kira_audio = { version = "0.27", features = ["ogg", "wav"] }
leafwing-input-manager = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "megaloot_core"
path = "src/lib.rs"
