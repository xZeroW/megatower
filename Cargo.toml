[workspace]
resolver = "2"
members = ["crates/megatower-game", "crates/megatower-client", "crates/megatower-core", "crates/megatower-ui", "crates/megatower-gameplay", "crates/megatower-profile", "crates/megatower-layout", "crates/megatower-settings", "crates/megatower-input", "crates/megatower-audio"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
bevy = { version = "0.20", features = ["wav", "bevy_settings"] }
bevy_auto_plugin = "0.12"
bevy_brp_extras = "0.23"
bevy_kira_audio = { version = "0.27", features = ["ogg", "wav"] }
leafwing-input-manager = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
